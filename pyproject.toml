[project]
name = "marimo-utils"
version = "0.1.0"
description = "Utilities for working with marimo notebooks, including Pydantic model display"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["marimo", "notebooks", "pydantic", "display"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "marimo>=0.19.4",
    "pydantic>=2.12.5",
]

[project.urls]
Homepage = "https://github.com/drothermel/marimo_utils"
Repository = "https://github.com/drothermel/marimo_utils"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
