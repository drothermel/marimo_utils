[project]
name = "marimo-utils"
version = "0.7.0"
description = "Utilities for working with marimo notebooks: Pydantic model display plus a Tailwind + shadcn UI primitives package"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Danielle Rothermel", email = "danielle.rothermel@gmail.com" },
]
requires-python = ">=3.12"
keywords = [
    "marimo",
    "notebooks",
    "pydantic",
    "display",
    "tailwind",
    "shadcn",
    "ui",
    "plotly",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "anywidget>=0.9",
    "dr-widget==0.2.0",
    "marimo[recommended]>=0.19.4",
    "pandas>=2.0",
    "plotly>=6.7.0",
    "pydantic>=2.12.5",
    "python-lucide>=0.2.24",
    "tailwind-merge>=0.3.3",
]

[project.urls]
Homepage = "https://github.com/drothermel/marimo_utils"
Repository = "https://github.com/drothermel/marimo_utils"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=8.3",
    "pytest-xdist>=3.6",
    "ruff>=0.14.13",
    "ty>=0.0.13",
]

[tool.ruff]
line-length = 88
target-version = "py312"
include = ["scripts/**/*.py", "src/**/*.py"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "DTZ",
    "E",
    "F",
    "FA",
    "FBT",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PIE",
    "PL",
    "PTH",
    "PT",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLOT",
    "T10",
    "TC",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = ["PLR1711", "S101", "TRY003", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"nbs/**/*.py" = ["E501", "F841", "RET503", "B018"]
"src/marimo_utils/ui/**" = ["PLR0913", "PD011"]
"src/marimo_utils/display.py" = [
    "B009",
    "B010",
] # getattr/setattr needed for type checker

[tool.ruff.lint.isort]
known-first-party = ["marimo_utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
exclude = ["nbs/**", "tests"]
